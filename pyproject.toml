[project]
name = "steady-2d-heat-inverse"
version = "0.1"
description = "2D steady heat inverse problem with discrete adjoint and PETSc TAO optimization"
requires-python = ">=3.11"

# Minimal dependencies, beyond those listed in environment.yaml
dependencies = []

# Project links, surfaced by packaging tooling.
[project.urls]
Documentation = "https://steady-2d-heat-inverse.readthedocs.io/"
Repository = "https://github.com/MinhMPA/steady-2d-heat-inverse"

# Optional dependencies for development and testing
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]
validation = [
  "matplotlib>=3.9",
]
plot = [
  "pyvista>=0.48",
]

# First sampling qualification is Python 3.12+, with eager CPU float64 JAX.
sampling = [
  "blackjax==1.7.1; python_version >= '3.12'",
  "jax[cpu]==0.11.2; python_version >= '3.12'",
  "jaxlib==0.11.2; python_version >= '3.12'",
]
diagnostics = [
  "arviz-stats==1.3.3; python_version >= '3.12'",
]

# For command-line scripts (if any).
# [project.scripts]
# steady-2d-heat = "your_module:main"

# Build system requirements.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# .py files that should be installed as top-level modules.
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "forward_solver",
  "heat_model",
  "conductivity_prior",
  "conductivity_posterior",
  "heat_inference",
  "posterior_store",
  "native_provenance",
  "hmc_blackjax",
  "hmc_run",
  "posterior_samples",
  "posterior_diagnostics",
  "hmc_validation",
  "temperature_observations",
  "adjoint_solver",
  "tao_solver",
  "domain_coefficient",
  "ksp_tolerance_controller",
  "benchmark_utils",
  "plotting_utils"
]

[tool.pytest.ini_options]
addopts = '-m "not hmc_study"'
markers = [
	"gradcheck: adjoint gradient validation tests",
	"hmc_study: long scientific conductivity posterior studies (excluded from ordinary CI)",
	]
