# Read the Docs configuration file.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Only the documentation toolchain is installed. The FEniCSx/PETSc stack is
# conda-only and is mocked at build time (see docs/conf.py autodoc_mock_imports).
python:
  install:
    - requirements: docs/requirements.txt
