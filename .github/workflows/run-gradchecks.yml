name: Run tests
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  gradcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"

    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          environment-name: steady-2d-heat-inverse
          cache-environment: true
          cache-downloads: true

      - name: Install package (editable) + dev extras
        shell: bash -l {0}
        run: pip install -e ".[dev]"

      - name: Run test suite
        shell: bash -l {0}
        run: pytest -q --maxfail=1 --durations=10

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation toolchain
        run: pip install -r docs/requirements.txt
      - name: Build docs with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
