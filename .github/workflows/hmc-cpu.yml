name: CPU conductivity posterior

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/HMCSampling.ipynb"
      - "constraints/**"
      - "docs/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/HMCSampling.ipynb"
      - "constraints/**"
      - "docs/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hmc-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      S2DHI_HMC_QUALIFICATION: "1"
      JAX_ENABLE_X64: "true"
      JAX_PLATFORMS: "cpu"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: "${{ github.workspace }}/src"
      MPLBACKEND: "Agg"
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: s2dhi-hmc
          cache-environment: true
          cache-downloads: true
      - name: Check native numerical environment before optional resolution
        run: |
          python - <<'PY'
          from importlib.metadata import version
          expected = {
              "numpy": "2.5.2", "scipy": "1.18.0", "petsc4py": "3.25.4",
              "fenics-dolfinx": "0.11.0", "h5py": "3.16.0",
          }
          actual = {name: version(name) for name in expected}
          print("Native numerical environment:", actual)
          if actual != expected:
              raise SystemExit(
                  "environment.yml resolved outside constraints/hmc-cpu-py312.txt. "
                  "Build a matching native conda environment or explicitly requalify it; "
                  "do not replace FEM/numerical libraries with pip."
              )
          PY
          python -m pip install --dry-run --report /tmp/hmc-resolution.json \
            -c constraints/hmc-cpu-py312.txt -e ".[dev,sampling,diagnostics,validation]"
          python - <<'PY'
          import json
          protected = {
              "numpy", "scipy", "petsc4py", "fenics-dolfinx", "h5py",
              "pandas", "mpi4py", "fenics-basix", "fenics-ufl",
          }
          proposed = {
              item["metadata"]["name"].lower().replace("_", "-")
              for item in json.load(open("/tmp/hmc-resolution.json"))["install"]
          }
          changes = proposed & protected
          if changes:
              raise SystemExit(
                  "Constrained pip resolution would replace native conda packages: "
                  + ", ".join(sorted(changes))
                  + ". Preserve the native environment; inspect constraints/hmc-cpu-py312.txt."
              )
          PY
      - name: Install constrained optional calculation and notebook packages
        run: |
          python -m pip install -c constraints/hmc-cpu-py312.txt \
            -e ".[dev,sampling,diagnostics,validation]"
          python -m pip check
      - name: Record calculation environment and compile a fresh heat form
        run: |
          micromamba list
          python - <<'PY'
          import os, platform
          from importlib.metadata import version
          from hmc_blackjax import require_sampling_environment
          from forward_solver import SteadyHeat2DForwardSolver
          print(platform.platform(), platform.machine())
          print(require_sampling_environment())
          for name in ("numpy", "scipy", "petsc4py", "fenics-dolfinx", "h5py", "arviz-stats", "nbclient", "nbformat", "ipykernel"):
              print(name, version(name))
          for name in ("CC", "CXX", "CFLAGS", "CPPFLAGS", "CXXFLAGS", "LDFLAGS", "CPATH", "LIBRARY_PATH", "OMP_NUM_THREADS", "OPENBLAS_NUM_THREADS", "MKL_NUM_THREADS"):
              print(name, os.environ.get(name))
          import arviz_stats
          PY
          XDG_CACHE_HOME="$(mktemp -d)" python - <<'PY'
          from forward_solver import SteadyHeat2DForwardSolver
          f = SteadyHeat2DForwardSolver(nmesh=2, h=1.0, q=1.0)
          f.solve()
          print("fresh-cache heat solve passed")
          PY
      - name: Require non-study HMC tests and notebook computation cells
        run: |
          python -m pytest tests/test_hmc*.py -q -m "not hmc_study" \
            --maxfail=1 --durations=10 --junitxml=/tmp/hmc-tests.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites = ElementTree.parse("/tmp/hmc-tests.xml").getroot().iter("testsuite")
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if skipped:
              raise SystemExit(f"Dedicated HMC job must not skip tests: {skipped} skipped")
          PY
